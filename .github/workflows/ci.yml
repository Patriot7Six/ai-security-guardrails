name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install modules
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Lint
        run: |
          # The runner image may preinstall a newer PSScriptAnalyzer, so load the pinned one.
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $results | ForEach-Object { "$($_.ScriptName):$($_.Line) [$($_.Severity)] $($_.RuleName) $($_.Message)" }
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer reported $($results.Count) issue(s)." }

      - name: Pester
        run: |
          Import-Module -Name Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Smoke test
        run: ./tests/Invoke-Smoke.ps1
